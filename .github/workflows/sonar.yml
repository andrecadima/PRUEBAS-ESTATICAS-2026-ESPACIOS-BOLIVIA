name: SonarCloud Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarCloud Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=PRUEBAS-ESTATICAS-2026-ESPACIOS-BOLIVIA
            -Dsonar.sources=EspaciosBolivia-master
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.angular/**,**/.scannerwork/**,**/coverage/**,**/package-lock.json,**/src/assets/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
