name: Sonar Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Set this repository variable for SonarQube Server.
          # Leave it unset when using SonarQube Cloud.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
